# Documentation site (VitePress, docs/) → GitHub Pages.
# PRs that touch the docs build it (dead links fail the build); pushes to main also deploy.
name: docs

on:
  pull_request:
    paths: ["docs/**", "CONTEXT.md", "package.json", "package-lock.json", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "CONTEXT.md", "package.json", "package-lock.json", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # "Mis à jour le" comes from git history
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
