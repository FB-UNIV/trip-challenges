name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real student names, emails, photos or access codes.** Security issues → SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Role (teacher / student), Trip phase (draft, challenge, voting, reveal, grace), and what you did.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser / device, self-hosted setup (object store, OIDC provider), relevant API logs.
