name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who hits it (teacher, student, operator) and when.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: data
    attributes:
      label: Does it touch student data?
      description: New data collected or kept, and how it is erased at trip end.
