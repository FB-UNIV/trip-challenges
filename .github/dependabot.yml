version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      # Families that must move together: a Fastify plugin major only works on the matching
      # Fastify major (#13/#14), and vitest needs @vitest/coverage-v8 in lockstep (#12).
      # Listed first, so their updates (majors included) land as one PR each.
      fastify:
        patterns: ["fastify", "fastify-plugin", "@fastify/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directories:
      - /packages/api
      - /packages/web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(docker)
