# Documentation site (VitePress, docs/) → GitHub Pages.
# PRs that touch the docs build it (dead links fail the build); pushes to main also deploy.
name: docs

on:
  pull_request:
    paths: ["docs/**", "CONTEXT.md", "package.json", "package-lock.json", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "CONTEXT.md", "package.json", "package-lock.json", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes with git; don't leave the token on disk
          fetch-depth: 0 # "Mis à jour le" comes from git history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
