# Release pipeline: on a version tag (v*), build + push the api/web Docker images to the
# Forgejo container registry and create a Forgejo release.
#
# Configure in the repo (Settings ▸ Actions ▸ Secrets/Variables):
#   vars.REGISTRY        e.g. forge.example.org   (your Forgejo host / registry)
#   secrets.REGISTRY_TOKEN   a token/password with package:write for ${{ github.actor }}
#   secrets.RELEASE_TOKEN    a token with repo:write (to create the release)
# The runner needs Docker available (buildx) and network access to the registry.
name: release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ${{ vars.REGISTRY }}
  OWNER: ${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: packages/api/Dockerfile
          - name: web
            dockerfile: packages/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/trip-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Forgejo release
        run: |
          set -euo pipefail
          notes="Automated release ${GITHUB_REF_NAME}.\n\nImages:\n- ${REGISTRY}/${OWNER}/trip-api:${GITHUB_REF_NAME#v}\n- ${REGISTRY}/${OWNER}/trip-web:${GITHUB_REF_NAME#v}"
          curl -fsSL -X POST \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"${GITHUB_REF_NAME}\",\"body\":\"${notes}\"}"
