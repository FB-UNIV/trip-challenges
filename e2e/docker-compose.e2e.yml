# E2E add-on to docker-compose.dev.yml: a local SMTP catcher so tests read the real
# access-code / invite emails over Mailpit's HTTP API.
#   docker compose -f docker-compose.dev.yml -f e2e/docker-compose.e2e.yml up -d
# Inbox UI: http://localhost:8025
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
