# Local development: runs ONLY the data services, published to localhost so you can
# run the API + PWA on your host with `npm run dev:api` / `npm run dev:web`.
#   docker compose -f docker-compose.dev.yml up -d
# Then in .env set POSTGRES_HOST=localhost, S3_ENDPOINT=http://localhost:9000,
# VAULT_ADDR=http://localhost:8200 (see README › developers).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trip}
      POSTGRES_USER: ${POSTGRES_USER:-trip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - ./packages/api/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  minio:
    # MinIO no longer publishes images on Docker Hub (minio/minio is gone); Chainguard
    # builds the same server from source. It runs as non-root, hence the tmpfs data dir —
    # fine for dev, where Vault is in-memory too, so blobs never outlive a restart anyway.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    tmpfs:
      - /data:mode=1777
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trip-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devpass123}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"   # web console

  vault:
    image: hashicorp/vault:latest
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: server -dev
    ports:
      - "127.0.0.1:${VAULT_HOST_PORT:-8200}:8200"
