# Release pipeline (semantic versioning via release-please).
#
# On every push to main, release-please keeps a "chore(main): release x.y.z" PR up to date
# with the next version (from Conventional Commit PR titles) and CHANGELOG.md. Merging that
# PR tags vX.Y.Z, creates the GitHub release, and the `images` job pushes the api/web images
# to GHCR as :X.Y.Z, :X.Y and :latest, with an SBOM + provenance attestation, then signs
# them keyless with cosign (Sigstore, via this workflow's OIDC identity — no key to manage).
# Verify command: docs/deployment.md §7.
#
# Optional secret RELEASE_PLEASE_TOKEN (fine-grained PAT: contents + pull-requests write), stored
# in the `release` environment (deployments from main only), not as a repository secret.
# Without it, release PRs are opened by GITHUB_TOKEN and GitHub does not run CI on them,
# so the required checks never report — see CLAUDE.md "Releases".
name: release

on:
  push:
    branches: [main]
  # Re-run release-please by hand, e.g. after adding a BEGIN_COMMIT_OVERRIDE to a merged PR
  # whose squash message the conventional-commit parser skipped (happened with #117).
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # RELEASE_PLEASE_TOKEN lives in this environment (main only), not in the repo's secrets,
    # so no other workflow or branch can read it.
    environment: release
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing (Sigstore OIDC)
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: packages/api/Dockerfile
          - name: web
            dockerfile: packages/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes with git; don't leave the token on disk
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; the owner may not be.
      - name: Image name
        id: image
        env:
          NAME: ${{ matrix.name }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/trip-${NAME}" >> "$GITHUB_OUTPUT"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Sign the digest, not a tag: tags move, the digest is what was built here.
      - name: Sign image
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
