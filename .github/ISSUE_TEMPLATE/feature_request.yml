name: Proposer une amélioration
description: Suggérer une évolution
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Quel problème cela résout-il ?
      description: Qui le rencontre (enseignant, élève, exploitant) et à quel moment.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Que souhaiteriez-vous ?
  - type: textarea
    id: data
    attributes:
      label: Cela touche-t-il aux données des élèves ?
      description: Nouvelles données collectées ou conservées, et comment elles sont effacées à la fin de la sortie.
