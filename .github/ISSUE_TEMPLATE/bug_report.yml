name: Signaler un bug
description: Quelque chose ne fonctionne pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Ne collez jamais de vrais noms, e-mails, photos ou codes d'accès d'élèves.** Problème de sécurité → SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Que s'est-il passé, et qu'attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes pour reproduire
      description: Rôle (enseignant / élève), phase de la sortie (brouillon, défis, vote, révélation, délai de grâce) et ce que vous avez fait.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag de release ou commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environnement
      description: Navigateur / appareil, installation (stockage objet, fournisseur OIDC), journaux de l'API utiles.
